spring.application.name=bookingapi

# --- SERVER ---
server.port=${PORT:8080}

# --- DATABASE ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres?user=postgres.zolawqjozfnynylevzgy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.zolawqjozfnynylevzgy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# --- MONITORING ---
management.endpoints.web.exposure.include=health,info