spring.application.name=bookingapi

# --- DATABASE CONFIGURATION ---
# Replace 'yourpassword' with your actual Postgres password
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- SECURITY (OAuth2) ---
# For the job showcase, this points to a mock issuer or Auth0
# If you don't have a real one yet, you can use a placeholder
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-placeholder.auth0.com/
jwt.secret=my-super-secret-key-that-is-at-least-32-characters-long
jwt.expiration=3600000

# --- MONITORING (For CI/CD) ---
management.endpoints.web.exposure.include=health,info